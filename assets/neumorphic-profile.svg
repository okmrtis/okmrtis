<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">okmrtis profile header</title>
  <desc id="desc">A white and gray neumorphic GitHub profile header for consulting workflow automation, AI agent collaboration, and externalized thinking with GitHub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFBFB"/>
      <stop offset="1" stop-color="#EEF2F4"/>
    </linearGradient>
    <linearGradient id="accent" x1="192" y1="264" x2="1017" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19C4E1"/>
      <stop offset="1" stop-color="#8EE7F2"/>
    </linearGradient>
    <filter id="shellShadow" x="66" y="38" width="1068" height="342" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="22" dy="26" stdDeviation="30" flood-color="#C6CDD2" flood-opacity="0.72"/>
      <feDropShadow dx="-20" dy="-20" stdDeviation="28" flood-color="#FFFFFF" flood-opacity="0.96"/>
    </filter>
    <filter id="cardShadow" x="-36" y="-32" width="430" height="152" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="10" dy="11" stdDeviation="12" flood-color="#C5CDD2" flood-opacity="0.48"/>
      <feDropShadow dx="-9" dy="-9" stdDeviation="12" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
    <filter id="lineSoftness" x="148" y="117" width="908" height="190" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="8" dy="9" stdDeviation="12" flood-color="#C8D0D5" flood-opacity="0.34"/>
      <feDropShadow dx="-8" dy="-8" stdDeviation="12" flood-color="#FFFFFF" flood-opacity="0.90"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="38" fill="url(#bg)"/>

  <g filter="url(#shellShadow)">
    <rect x="112" y="72" width="976" height="276" rx="42" fill="#F6F8F8"/>
    <rect x="113.5" y="73.5" width="973" height="273" rx="40.5" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <g filter="url(#lineSoftness)">
    <path d="M176 286C284 226 381 231 470 265C554 297 611 270 681 221C753 171 829 155 907 181C962 199 997 191 1030 159" stroke="#D8E0E4" stroke-width="8" stroke-linecap="round" opacity="0.78"/>
    <path d="M552 176C613 139 657 118 723 131C783 143 809 185 864 199C923 214 967 192 1029 144" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" opacity="0.96"/>
  </g>

  <circle cx="204" cy="126" r="13" fill="#19C4E1"/>
  <circle cx="238" cy="126" r="13" fill="#E7ECEF"/>
  <circle cx="272" cy="126" r="13" fill="#D9E0E4"/>

  <text x="168" y="181" fill="#2F3A40" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="0">okmrtis</text>
  <text x="170" y="222" fill="#5F6C74" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="560" letter-spacing="0">automation / agents / extended thinking</text>
  <text x="171" y="258" fill="#7C8A91" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="520" letter-spacing="0">calm systems for repeatable, reviewable work</text>

  <g transform="translate(733 108)" filter="url(#cardShadow)">
    <rect width="288" height="64" rx="26" fill="#F7F9F9"/>
    <rect x="24" y="21" width="8" height="22" rx="4" fill="#19C4E1"/>
    <text x="149" y="39" text-anchor="middle" fill="#405057" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="0">consulting workflows</text>
  </g>

  <g transform="translate(762 187)" filter="url(#cardShadow)">
    <rect width="259" height="64" rx="26" fill="#F7F9F9"/>
    <rect x="24" y="21" width="8" height="22" rx="4" fill="#BDEFF6"/>
    <text x="142" y="39" text-anchor="middle" fill="#405057" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="0">agent collaboration</text>
  </g>

  <g transform="translate(703 266)" filter="url(#cardShadow)">
    <rect width="318" height="64" rx="26" fill="#F7F9F9"/>
    <rect x="24" y="21" width="8" height="22" rx="4" fill="#19C4E1"/>
    <text x="168" y="39" text-anchor="middle" fill="#405057" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="0">GitHub thinking layer</text>
  </g>

  <rect x="1022" y="112" width="8" height="174" rx="4" fill="#19C4E1"/>
  <rect x="1001" y="137" width="8" height="116" rx="4" fill="#CFEFF5"/>
</svg>
