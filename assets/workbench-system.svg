<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Soft systems workbench map</title>
  <desc id="desc">A white and gray neumorphic workflow map showing consulting work, AI agent collaboration, and GitHub thinking systems.</desc>
  <defs>
    <linearGradient id="cyan" x1="172" y1="160" x2="1028" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19C4E1"/>
      <stop offset="1" stop-color="#93ECF5"/>
    </linearGradient>
    <filter id="panelShadow" x="60" y="26" width="1080" height="288" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="18" dy="22" stdDeviation="26" flood-color="#C5CCD1" flood-opacity="0.48"/>
      <feDropShadow dx="-18" dy="-18" stdDeviation="24" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
    <filter id="cardShadow" x="-28" y="-28" width="358" height="176" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="10" dy="11" stdDeviation="12" flood-color="#C5CDD2" flood-opacity="0.45"/>
      <feDropShadow dx="-9" dy="-9" stdDeviation="12" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
  </defs>

  <g filter="url(#panelShadow)">
    <rect x="102" y="62" width="996" height="216" rx="36" fill="#FFFFFF"/>
    <rect x="103.5" y="63.5" width="993" height="213" rx="34.5" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <path d="M276 170H462" stroke="#D8E1E5" stroke-width="8" stroke-linecap="round"/>
  <path d="M738 170H924" stroke="#D8E1E5" stroke-width="8" stroke-linecap="round"/>
  <path d="M276 170H462M738 170H924" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round" opacity="0.95"/>

  <g transform="translate(148 110)" filter="url(#cardShadow)">
    <rect width="260" height="120" rx="26" fill="#FFFFFF"/>
    <rect x="24" y="24" width="8" height="38" rx="4" fill="#19C4E1"/>
    <text x="48" y="45" fill="#344249" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="750" letter-spacing="0">Consulting work</text>
    <text x="48" y="76" fill="#718087" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="520" letter-spacing="0">repeatable desk flows</text>
  </g>

  <g transform="translate(470 110)" filter="url(#cardShadow)">
    <rect width="260" height="120" rx="26" fill="#FFFFFF"/>
    <rect x="24" y="24" width="8" height="38" rx="4" fill="#BDEFF6"/>
    <text x="48" y="45" fill="#344249" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="750" letter-spacing="0">AI agents</text>
    <text x="48" y="76" fill="#718087" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="520" letter-spacing="0">handoffs, reviews, recovery</text>
  </g>

  <g transform="translate(792 110)" filter="url(#cardShadow)">
    <rect width="260" height="120" rx="26" fill="#FFFFFF"/>
    <rect x="24" y="24" width="8" height="38" rx="4" fill="#19C4E1"/>
    <text x="48" y="45" fill="#344249" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="750" letter-spacing="0">GitHub context</text>
    <text x="48" y="76" fill="#718087" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="520" letter-spacing="0">externalize, extend, resume</text>
  </g>

  <text x="600" y="258" text-anchor="middle" fill="#65737A" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="560" letter-spacing="0">A quiet loop for making work easier to restart, inspect, and improve.</text>
</svg>
